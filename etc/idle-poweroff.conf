# /etc/idle-poweroff/idle-poweroff.conf
# Ships in DRY_RUN=1: logs "would power off" to the journal and does nothing else.
# Set DRY_RUN=0 only after a manual poweroff + Wake-on-LAN test has succeeded.
DRY_RUN=1

IDLE_MINUTES=30          # continuous idle time before poweroff
BOOT_GRACE_MINUTES=20    # never power off this soon after boot (covers wake -> first request)
GPU_UTIL_MAX=5           # % utilization on any GPU counts as busy above this
LOAD5_MAX=12             # 5-min load average; set above your idle baseline
WATCH_PORTS=""           # space-separated TCP ports; any established client = busy, e.g. "8000 11434"
IGNORE_SESSIONS=0        # 1 = logged-in SSH/console sessions do not block poweroff

# Optional: treat any running podman container whose name does NOT match this regex as busy.
#   IGNORE_CONTAINERS_MATCHING='^(my-inference|node-exporter)'

# Disable auto-poweroff entirely:   sudo touch /etc/idle-poweroff/no-autooff
